<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Agency</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #0f0f14;
      color: #ffffff;
      font-family: Arial, sans-serif;
    }
    .box {
      text-align: center;
      padding: 40px;
      border-radius: 14px;
      background: #15151d;
      box-shadow: 0 0 0 1px #2a2a35;
    }
    h1 {
      margin: 0 0 10px;
      font-size: 28px;
    }
    p {
      margin: 0;
      opacity: .7;
    }
  </style>
</head>
<body>
  <div class="box">
    <h1>IT WORKS ✅</h1>
    <p>GitHub Pages is alive</p>
  </div>
</body>
</html>
